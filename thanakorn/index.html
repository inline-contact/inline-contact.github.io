<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thanakorn Plungmanee · INLINE Network</title>
<meta name="description" content="Thanakorn Plungmanee — CEO, INLINE Network Co., Ltd.">
<meta name="theme-color" content="#F6F4EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F6B;--navy2:#1A3591;--gold:#B8913A;--gold2:#D9B865;--cream:#F6F4EE;--ink:#2B2F3A;--mute:#7A7F8C}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--cream);color:var(--ink);display:flex;justify-content:center;align-items:flex-start;padding:28px 16px 40px;overflow-x:hidden;position:relative;min-height:100vh}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0;pointer-events:none}
.o1{width:320px;height:320px;background:#1A3591;top:-120px;left:-110px;opacity:.28}
.o2{width:300px;height:300px;background:#D9B865;bottom:-90px;right:-100px;opacity:.45}
.o3{width:200px;height:200px;background:#0B1F6B;bottom:22%;left:-120px;opacity:.16}
.card{position:relative;z-index:1;width:100%;max-width:420px;background:rgba(255,255,255,.78);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-radius:28px;padding:30px 22px 26px;box-shadow:0 24px 60px -24px rgba(11,31,107,.28),0 2px 6px rgba(11,31,107,.05);text-align:center}
.card::before{content:"";position:absolute;inset:7px;border-radius:22px;border:1px solid rgba(184,145,58,.38);pointer-events:none}
.logo{width:150px;height:auto;display:block;margin:2px auto 18px}
.eyebrow{font-size:11px;letter-spacing:.32em;color:var(--gold);font-weight:600;margin-bottom:10px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;color:var(--navy);font-size:clamp(22px,6.6vw,32px);letter-spacing:.02em;line-height:1.1;white-space:nowrap}
.thai{font-size:13px;color:var(--mute);margin-top:4px}
.title{margin-top:12px;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);font-weight:500}
.company{margin-top:5px;font-size:13px;color:var(--mute)}
.divider{display:flex;align-items:center;gap:10px;margin:20px auto 22px;width:70%}
.divider span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.divider i{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);display:block}
.chat{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px 12px 12px;margin-bottom:12px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--navy2),var(--navy) 70%);color:#fff;text-decoration:none;font:inherit;font-size:15.5px;font-weight:500;text-align:left;cursor:pointer;box-shadow:0 10px 22px -10px rgba(11,31,107,.6)}
.chat::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);animation:shine 4.8s ease-in-out infinite}
@keyframes shine{0%,62%{left:-60%}100%{left:130%}}
.chat:active{transform:scale(.985)}
.tile{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.tile svg{width:26px;height:26px}
.chat small{display:block;font-size:11.5px;font-weight:400;opacity:.7;margin-top:1px}
.chat .arr{margin-left:auto;opacity:.6;font-size:18px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.mini{display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 4px 11px;background:#fff;border:1px solid rgba(11,31,107,.09);border-radius:14px;color:var(--navy);text-decoration:none;font-size:12.5px;font-weight:500;box-shadow:0 4px 12px -6px rgba(11,31,107,.18)}
.mini svg{width:21px;height:21px}
.mini:active{background:#f3f4f9}
.addr{display:flex;gap:10px;align-items:flex-start;text-align:left;margin-top:22px;padding-top:18px;border-top:1px solid rgba(11,31,107,.08);font-size:12.5px;line-height:1.55;color:var(--mute)}
.addr svg{flex:none;width:17px;height:17px;margin-top:2px;color:var(--gold)}
.fx{opacity:0;transform:translateY(14px);animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fx{animation:none;opacity:1;transform:none}.chat::after{animation:none}}
</style>
</head>
